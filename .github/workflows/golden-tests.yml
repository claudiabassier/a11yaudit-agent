# A11yAudit — golden-test CI
#
# Runs the deterministic Code-node regression suite (tests/golden) on every
# push and pull request. This is not a substitute for the live n8n/Postgres
# verification this project's decision_log.md repeatedly insists on — it
# only proves the Code-node chain itself is unchanged for the three pinned
# fixtures. See tests/golden/README.md "Out of scope" for exactly what this
# does and does not cover: no live Postgres, no live HTTP fetch, no AI call.
#
# Added 19 August 2026 (rigorous review, decision_log.md D-82/external
# review Finding 8: "no CI" — until now every regression check in this
# project's history was a manually-run `tests/golden/run.sh`, never
# enforced automatically).

name: Golden tests

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests/golden (builds its own Docker image, matches local `run.sh`)
        run: sh tests/golden/run.sh

      - name: Fail loudly on any FAIL/ERROR in the run.sh output
        if: failure()
        run: |
          echo "::error::tests/golden reported a failure — see the 'Run tests/golden' step output above for the exact node/fixture that diverged."
