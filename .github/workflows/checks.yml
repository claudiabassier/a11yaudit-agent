# A11yAudit — automated checks
#
# Runs every self-contained, exit-code-bearing check this project has on
# every push and pull request. None of this is a substitute for the live
# n8n verification decision_log.md repeatedly insists on — nothing here
# imports the real workflows into n8n, submits the real form, or makes a
# live AI call (external review Finding 7, deliberately not attempted in
# one sitting — see decision_log.md D-84). See tests/golden/README.md
# "Out of scope" for exactly what the golden suite does and does not cover.
#
# Added 19 August 2026 (rigorous review, decision_log.md D-83/D-84,
# external review Finding 8: "no CI" — until then every one of these was
# manually invoked, never enforced automatically). Extended the same day
# (D-85) with static checks that would have caught several of the day's
# own doc-drift and SQL-comment findings automatically instead of by hand,
# plus a real Postgres service-container job.

name: Checks

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Automates the manual step build_runbook.md §6 already names
      # ("confirm no credential values or API keys appear in the workflow
      # JSON... check any hard-coded headers or Code nodes") rather than
      # leaving it dependent on someone remembering to do it by hand.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  golden-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tests/golden (builds its own Docker image, matches local run.sh)
        run: sh tests/golden/run.sh

  standalone-harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the shared test image (same one tests/golden uses)
        run: docker build -t a11yaudit-golden tests/golden
      - name: Prompt-injection harness (code/_prompt_injection_harness.js)
        run: docker run --rm -v "$PWD":/repo -w /repo a11yaudit-golden node code/_prompt_injection_harness.js
      - name: Evidence-fabrication harness (code/_S4_evidence_check_harness.js)
        run: docker run --rm -v "$PWD":/repo -w /repo a11yaudit-golden node code/_S4_evidence_check_harness.js

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check every code/*.js file (node --check)
        run: |
          for f in code/*.js; do
            node --check "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done
      - name: SQL comment guard — no {{ }} inside a "--" comment (decision_log.md D-71)
        run: bash meta/check_sql_comments.sh
      - name: Absolute-claims check (meta/claims_check.sh)
        run: |
          bash meta/claims_check.sh
          # Advisory only, see the script's own header: flags candidates for
          # human judgement (needs a citation/hedge/removal), not an
          # automatic pass/fail — it does not set a failing exit code.
      - name: Broken-link check (meta/check_broken_links.sh) — advisory, not blocking
        run: bash meta/check_broken_links.sh || echo "::warning::check_broken_links.sh found candidates — see job log; this project's own explanatory prose ('X was renamed to Y') produces expected false positives here, so this step does not fail the build. Read the output by hand."
        continue-on-error: true

  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: n8n
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U n8n"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci_test_only
    steps:
      - uses: actions/checkout@v4
      # Both real database names this project actually uses — not a
      # synthetic CI-only name — so postgres_app_role.sql's own two
      # GRANT CONNECT lines (one per database) both succeed unmodified,
      # exactly as they run outside CI.
      - name: Create a11yaudit and a11yaudit_dev
        run: |
          psql -h localhost -U n8n -d postgres -c "CREATE DATABASE a11yaudit;"
          psql -h localhost -U n8n -d postgres -c "CREATE DATABASE a11yaudit_dev;"
      - name: Apply postgres_schema.sql to a11yaudit_dev
        run: psql -h localhost -U n8n -d a11yaudit_dev -v ON_ERROR_STOP=1 -f postgres_schema.sql
      - name: Verify expected tables and views exist
        run: |
          set -e
          want_tables="audits findings instrument_items audit_runs error_log"
          want_views="v_review_queue v_audit_summary v_pipeline_health"
          have=$(psql -h localhost -U n8n -d a11yaudit_dev -tAc "SELECT string_agg(tablename, ' ') FROM pg_tables WHERE schemaname='public'")
          for t in $want_tables; do
            case " $have " in *" $t "*) ;; *) echo "::error::missing table: $t"; exit 1 ;; esac
          done
          haveviews=$(psql -h localhost -U n8n -d a11yaudit_dev -tAc "SELECT string_agg(viewname, ' ') FROM pg_views WHERE schemaname='public'")
          for v in $want_views; do
            case " $haveviews " in *" $v "*) ;; *) echo "::error::missing view: $v"; exit 1 ;; esac
          done
          echo "All expected tables and views present: $want_tables / $want_views"
      - name: Apply postgres_app_role.sql and cross-check its grants against every table postgres_schema.sql created
        run: |
          set -e
          psql -h localhost -U n8n -d a11yaudit_dev -v ON_ERROR_STOP=1 -f postgres_app_role.sql
          # Every table/view above must have at least one grant to a11yaudit_app.
          # This is a coverage check (something was granted), not a
          # statement-level correctness check against each code/*.sql file's
          # actual needs — that judgement call (INSERT-only on audit_runs/
          # error_log, no DELETE anywhere) still needs a human reading
          # postgres_app_role.sql's own comments, same as D-82's manual pass.
          ungranted=$(psql -h localhost -U n8n -d a11yaudit_dev -tAc "
            SELECT string_agg(t.tablename, ' ') FROM pg_tables t
            WHERE t.schemaname='public'
              AND NOT EXISTS (
                SELECT 1 FROM information_schema.role_table_grants g
                WHERE g.table_name = t.tablename AND g.grantee = 'a11yaudit_app'
              )")
          if [ -n "$ungranted" ]; then
            echo "::error::table(s) with no grant at all to a11yaudit_app: $ungranted"
            exit 1
          fi
          echo "Every table has at least one grant to a11yaudit_app."
