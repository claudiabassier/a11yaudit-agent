# A11yAudit — automated checks
#
# Runs every self-contained, exit-code-bearing check this project has on
# every push and pull request. None of this is a substitute for the live
# n8n verification decision_log.md repeatedly insists on — nothing here
# imports the real workflows into n8n, submits the real form, or makes a
# live AI call (external review Finding 7, deliberately not attempted in
# one sitting — see decision_log.md D-84). See tests/golden/README.md
# "Out of scope" for exactly what the golden suite does and does not cover.
#
# Added 19 August 2026 (rigorous review, decision_log.md D-83/D-84,
# external review Finding 8: "no CI" — until then every one of these was
# manually invoked, never enforced automatically). Extended the same day
# (D-85) with static checks that would have caught several of the day's
# own doc-drift and SQL-comment findings automatically instead of by hand,
# plus a real Postgres service-container job.

name: Checks

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Automates the manual step build_runbook.md §6 already names
      # ("confirm no credential values or API keys appear in the workflow
      # JSON... check any hard-coded headers or Code nodes") rather than
      # leaving it dependent on someone remembering to do it by hand.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  golden-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tests/golden (builds its own Docker image, matches local run.sh)
        run: sh tests/golden/run.sh

  standalone-harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the shared test image (same one tests/golden uses)
        run: docker build -t a11yaudit-golden tests/golden
      - name: Prompt-injection harness (code/_prompt_injection_harness.js)
        run: docker run --rm -v "$PWD":/repo -w /repo a11yaudit-golden node code/_prompt_injection_harness.js
      - name: Evidence-fabrication harness (code/_S4_evidence_check_harness.js)
        run: docker run --rm -v "$PWD":/repo -w /repo a11yaudit-golden node code/_S4_evidence_check_harness.js

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check every code/*.js file (node --check)
        run: |
          for f in code/*.js; do
            node --check "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done
      - name: SQL comment guard — no {{ }} inside a "--" comment (decision_log.md D-71)
        run: bash meta/check_sql_comments.sh
      - name: Absolute-claims check (meta/claims_check.sh)
        run: |
          bash meta/claims_check.sh
          # Advisory only, see the script's own header: flags candidates for
          # human judgement (needs a citation/hedge/removal), not an
          # automatic pass/fail — it does not set a failing exit code.
      - name: Broken-link check (meta/check_broken_links.sh) — advisory, not blocking
        run: bash meta/check_broken_links.sh || echo "::warning::check_broken_links.sh found candidates — see job log; this project's own explanatory prose ('X was renamed to Y') produces expected false positives here, so this step does not fail the build. Read the output by hand."
        continue-on-error: true

  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: n8n
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U n8n"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci_test_only
    steps:
      - uses: actions/checkout@v4
      # Both real database names this project actually uses — not a
      # synthetic CI-only name — so postgres_app_role.sql's own two
      # GRANT CONNECT lines (one per database) both succeed unmodified,
      # exactly as they run outside CI.
      - name: Create a11yaudit and a11yaudit_dev
        run: |
          psql -h localhost -U n8n -d postgres -c "CREATE DATABASE a11yaudit;"
          psql -h localhost -U n8n -d postgres -c "CREATE DATABASE a11yaudit_dev;"
      - name: Apply postgres_schema.sql to a11yaudit_dev
        run: psql -h localhost -U n8n -d a11yaudit_dev -v ON_ERROR_STOP=1 -f postgres_schema.sql
      - name: Verify expected tables and views exist
        run: |
          set -e
          want_tables="audits findings instrument_items audit_runs error_log"
          want_views="v_review_queue v_audit_summary v_pipeline_health"
          have=$(psql -h localhost -U n8n -d a11yaudit_dev -tAc "SELECT string_agg(tablename, ' ') FROM pg_tables WHERE schemaname='public'")
          for t in $want_tables; do
            case " $have " in *" $t "*) ;; *) echo "::error::missing table: $t"; exit 1 ;; esac
          done
          haveviews=$(psql -h localhost -U n8n -d a11yaudit_dev -tAc "SELECT string_agg(viewname, ' ') FROM pg_views WHERE schemaname='public'")
          for v in $want_views; do
            case " $haveviews " in *" $v "*) ;; *) echo "::error::missing view: $v"; exit 1 ;; esac
          done
          echo "All expected tables and views present: $want_tables / $want_views"
      - name: Apply postgres_app_role.sql and cross-check its grants against every table postgres_schema.sql created
        run: |
          set -e
          psql -h localhost -U n8n -d a11yaudit_dev -v ON_ERROR_STOP=1 -f postgres_app_role.sql
          # Every table/view above must have at least one grant to a11yaudit_app.
          # This is a coverage check (something was granted), not a
          # statement-level correctness check against each code/*.sql file's
          # actual needs — that judgement call (INSERT-only on audit_runs/
          # error_log, no DELETE anywhere) still needs a human reading
          # postgres_app_role.sql's own comments, same as D-82's manual pass.
          ungranted=$(psql -h localhost -U n8n -d a11yaudit_dev -tAc "
            SELECT string_agg(t.tablename, ' ') FROM pg_tables t
            WHERE t.schemaname='public'
              AND NOT EXISTS (
                SELECT 1 FROM information_schema.role_table_grants g
                WHERE g.table_name = t.tablename AND g.grantee = 'a11yaudit_app'
              )")
          if [ -n "$ungranted" ]; then
            echo "::error::table(s) with no grant at all to a11yaudit_app: $ungranted"
            exit 1
          fi
          echo "Every table has at least one grant to a11yaudit_app."

  n8n-e2e:
    # Closes external review Finding 7: none of the checks above ever
    # imports the real workflows into a real n8n, submits the real form,
    # or writes through the real Postgres nodes — they all run isolated
    # code. This job does. Deliberately proven by hand first against
    # throwaway containers (decision_log.md D-87) before being written
    # here, the same discipline every other CI job in this file followed.
    #
    # No live AI call, and deliberately so (see the "Bewusst nicht in CI"
    # note in A11yAudit_Fahrplan.md): the Anthropic credential imported
    # below is intentionally invalid, forcing SUB-A's own fallback path
    # (R2) rather than skipping the AI node — this is the one path this
    # project's own design makes a first-class, tested outcome (S3/E11),
    # not a workaround. It proves the real n8n canvas — import, publish,
    # webhook, all four Postgres write nodes, WF-Error wiring — actually
    # works as deployed, deterministically and at zero API cost. It does
    # NOT prove the real Claude call behaves as documented; that remains
    # a live, manual, periodic check, never a per-push CI gate.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: n8n
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U n8n"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci_test_only
    steps:
      - uses: actions/checkout@v4

      - name: Prepare a11yaudit_dev
        run: |
          psql -h localhost -U n8n -d postgres -c "CREATE DATABASE a11yaudit_dev;"
          psql -h localhost -U n8n -d a11yaudit_dev -v ON_ERROR_STOP=1 -f postgres_schema.sql

      - name: Serve fixtures/ locally (n8n's Fetch Page node needs a real URL to hit)
        run: |
          python3 -m http.server 8899 --directory fixtures &
          sleep 1
          curl -sf -o /dev/null http://localhost:8899/bp-meds-short.html

      # host.docker.internal (via --add-host=...:host-gateway), not
      # --network host: the officially portable way for a container to
      # reach the host's own localhost — proven working in THIS project
      # already (decision_log.md D-80's live verification used the exact
      # same mechanism), unlike --network host, whose behaviour differs
      # between Docker Desktop (Mac, used to hand-verify this job before
      # writing it, decision_log.md D-87) and native Linux (what this
      # runner actually is) — not something to trust unverified.
      - name: Start n8n (headless — N8N_USER_MANAGEMENT_DISABLED, no owner-setup wizard)
        run: |
          docker run -d --name ci-n8n -p 5678:5678 --add-host=host.docker.internal:host-gateway \
            -e DB_TYPE=postgresdb -e DB_POSTGRESDB_HOST=host.docker.internal -e DB_POSTGRESDB_PORT=5432 \
            -e DB_POSTGRESDB_DATABASE=a11yaudit_dev -e DB_POSTGRESDB_USER=n8n -e DB_POSTGRESDB_PASSWORD=ci_test_only \
            -e N8N_ENCRYPTION_KEY=ci-test-encryption-key-not-a-secret \
            -e N8N_USER_MANAGEMENT_DISABLED=true \
            -e NODE_FUNCTION_ALLOW_EXTERNAL=cheerio -e NODE_FUNCTION_ALLOW_BUILTIN=crypto \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            docker.n8n.io/n8nio/n8n:2.32.7
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5678/healthz && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:5678/healthz || { echo "::error::n8n did not become healthy"; docker logs ci-n8n; exit 1; }
          # /healthz answering is not enough on its own (decision_log.md
          # D-90's first failure on this runner, a different symptom of the
          # same root cause: a CLI command run too soon raced the server's
          # own migration/startup sequence on the same fresh database and
          # crashed — "relation ... does not exist"). Wait for the server's
          # own log line confirming full startup before touching it with
          # any exec-based command.
          for i in $(seq 1 30); do
            docker logs ci-n8n 2>&1 | grep -q "Editor is now accessible via" && break
            sleep 2
          done
          docker logs ci-n8n 2>&1 | grep -q "Editor is now accessible via" || { echo "::error::n8n never logged full startup completion"; docker logs ci-n8n; exit 1; }

      - name: Import workflows and credentials
        run: |
          set -e
          # workflows_export_dev/ (D-89), not workflows_export/ — the latter
          # is the frozen v1.3 submission (5 August), a different, older
          # architecture (predates D-55's SUB-A_Validate subworkflow
          # extraction entirely). Importing it here would have made this
          # job a repeat of exactly the blind spot external review Finding 1
          # named: a test that stays green while testing something other
          # than the current code. workflows_export_dev/ is pulled fresh
          # from the live -dev canvas's actual execution source
          # (activeVersionId -> workflow_history, D-80) whenever code/
          # changes are published — see workflows_export_dev/README.md.
          docker cp workflows_export_dev/WF-Error-dev.json ci-n8n:/tmp/WF-Error-dev.json
          docker cp workflows_export_dev/WF1_Audit_Intake-dev.json ci-n8n:/tmp/WF1_Audit_Intake-dev.json
          docker cp workflows_export_dev/SUB-A_AI_Analysis-dev.json ci-n8n:/tmp/SUB-A_AI_Analysis-dev.json
          docker cp workflows_export_dev/SUB-A_Validate-dev.json ci-n8n:/tmp/SUB-A_Validate-dev.json
          docker exec ci-n8n n8n import:workflow --input=/tmp/WF-Error-dev.json
          docker exec ci-n8n n8n import:workflow --input=/tmp/WF1_Audit_Intake-dev.json
          docker exec ci-n8n n8n import:workflow --input=/tmp/SUB-A_AI_Analysis-dev.json
          docker exec ci-n8n n8n import:workflow --input=/tmp/SUB-A_Validate-dev.json
          # IDs/names must match the credential references baked into the
          # exported workflow JSON exactly (workflows_export_dev/*.json
          # carry only a credential id+name reference, never the secret
          # itself). The Postgres credential is the least-privilege
          # a11yaudit_app one (D-66/D-89 — the six write nodes were found
          # live-authenticating as the n8n superuser role instead, contrary
          # to what readme.md/decision_log.md D-66 claimed; fixed the same
          # day). CI doesn't need to recreate that restricted role — the
          # credential id/name here only has to match the workflow's own
          # reference; the connection details point at this job's own
          # throwaway superuser Postgres, same as every other job in this
          # file. The Anthropic key is deliberately invalid — see the
          # job-level comment above.
          cat > /tmp/ci_credentials.json << 'EOF'
          [
            { "id": "Yfrz4WaolHPKiGcw", "name": "Postgres a11yaudit_app (dev)", "type": "postgres",
              "data": { "host": "host.docker.internal", "port": 5432, "database": "a11yaudit_dev", "user": "n8n", "password": "ci_test_only" } },
            { "id": "5WVzsoNCm1M8TLEY", "name": "Anthropic account", "type": "anthropicApi",
              "data": { "apiKey": "sk-ci-deliberately-invalid-no-real-calls" } }
          ]
          EOF
          docker cp /tmp/ci_credentials.json ci-n8n:/tmp/ci_credentials.json
          docker exec ci-n8n n8n import:credentials --input=/tmp/ci_credentials.json

      - name: Publish (activate) all four workflows, then restart to apply
        run: |
          set -e
          docker exec ci-n8n n8n publish:workflow --id=HcX4w4xiQV5ZZY50  # WF-Error-dev
          docker exec ci-n8n n8n publish:workflow --id=JbyzWB2b6hEPA8aM  # WF1 - Audit Intake-dev
          docker exec ci-n8n n8n publish:workflow --id=vK4HhxgU9byGvqVp  # SUB-A_AI_Analysis-dev
          docker exec ci-n8n n8n publish:workflow --id=n9pcFHHVj8Gqu6yG  # SUB-A_Validate-dev
          # publish:workflow's own output says so explicitly: changes need
          # a restart to take effect on an already-running instance.
          before=$(docker logs ci-n8n 2>&1 | grep -c "Editor is now accessible via")
          docker restart ci-n8n
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5678/healthz && break
            sleep 2
          done
          # Same reasoning as the first startup: healthz alone raced the
          # webhook-registration step once already (D-90) — wait for a NEW
          # "fully up" log line (docker logs is cumulative across a
          # restart, so watch the count grow past its pre-restart value,
          # not just for the string to appear).
          for i in $(seq 1 30); do
            after=$(docker logs ci-n8n 2>&1 | grep -c "Editor is now accessible via")
            [ "$after" -gt "$before" ] && break
            sleep 2
          done
          after=$(docker logs ci-n8n 2>&1 | grep -c "Editor is now accessible via")
          [ "$after" -gt "$before" ] || { echo "::error::n8n never completed its post-restart startup"; docker logs ci-n8n; exit 1; }
          docker exec ci-n8n n8n list:workflow --active=true

      - name: Submit the real form (multipart/form-data — build_runbook.md's own D-84 note on this)
        run: |
          set -e
          # /healthz turned out not to be enough (decision_log.md D-89's
          # first real run on this runner): n8n's HTTP server answers
          # healthz before "Start Active Workflows" finishes registering
          # every workflow's triggers in order. The real n8n log for that
          # failed run shows it precisely — WF-Error-dev already active,
          # WF1's Form Trigger webhook still unregistered, this exact POST
          # arriving in that window: "Received request for unknown
          # webhook". Retry the POST itself, not just the health probe.
          for i in $(seq 1 15); do
            code=$(curl -s -o /tmp/form_resp.html -w '%{http_code}' -X POST "http://localhost:5678/form/7769bc3d-55c5-4fe6-b363-ba338956d0b4" \
              -F "field-0=http://host.docker.internal:8899/bp-meds-short.html" \
              -F "field-3=en" \
              -F "field-4=general_public")
            [ "$code" = "200" ] && break
            echo "form POST attempt $i: HTTP $code, retrying..."
            sleep 2
          done
          echo "form POST: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::form webhook never returned 200"; docker logs ci-n8n; exit 1; }

      - name: Wait for the execution, then assert against the real audits row
        run: |
          set -e
          for i in $(seq 1 30); do
            row=$(psql -h localhost -U n8n -d a11yaudit_dev -tAc "SELECT status||'|'||ai_fallback_used||'|'||human_review_required||'|'||triggered_rules::text FROM audits ORDER BY created_at DESC LIMIT 1")
            [ -n "$row" ] && break
            sleep 2
          done
          echo "audits row: $row"
          [ -n "$row" ] || { echo "::error::no audits row appeared within 60s"; docker logs ci-n8n; exit 1; }
          # boolean||text concatenation renders as the words "true"/"false"
          # (confirmed directly against a throwaway Postgres 16, not
          # assumed) — not the "t"/"f" abbreviation psql's own \pset
          # table rendering uses for a boolean *column*, which is a
          # different, client-side-only formatting path. First version of
          # this assertion used "t"/"f" and failed the real run on
          # GitHub's Linux runner (decision_log.md D-87) despite passing
          # by hand locally, because the local hand-test used a plain
          # SELECT with separate columns, not this exact concatenated
          # query — the gap between what was verified and what shipped.
          case "$row" in
            needs_review\|true\|true\|*R2*) echo "PASS — AI-fallback path completed end to end through the real n8n canvas: status=needs_review, ai_fallback_used=true, human_review_required=true, R2 fired." ;;
            *) echo "::error::unexpected audits row shape: $row"; exit 1 ;;
          esac

      - name: Dump n8n logs (always, for debugging a future failure here)
        if: always()
        run: docker logs ci-n8n 2>&1 | tail -100
