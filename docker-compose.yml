name: a11yaudit

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    # Pinned, not :latest (D-85, 19 August) — :latest meant a fresh
    # `docker compose up` could silently pull a different n8n version than
    # the one this whole project has been built and tested against for
    # three weeks (confirmed running version, checked directly against the
    # live container: 2.32.7 — also the version D-50 names for its own
    # test-form CSP workaround, so this is not a guess). Bump deliberately,
    # not by drift: re-verify tests/golden and a real form submission
    # before moving this tag.
    image: docker.n8n.io/n8nio/n8n:2.32.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=Europe/Berlin
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # For a first local run you can silence non-critical warnings:
      - N8N_RUNNERS_ENABLED=true
      # Code nodes: allow the HTML parser and Node's crypto module.
      # If cheerio becomes unreachable: this is a new, undiagnosed problem,
      # not a switch-to-fallback case. The regex-based Day-1 contingency
      # (code/05_automated_checks_regex.js) was retired 18 August, three
      # defects behind this file with no production use to justify keeping
      # it current (decision_log.md D-69) — it no longer exists on this
      # branch. Node 8 needs no change either way, it falls back to a
      # self-contained SHA-256 if crypto is unreachable.
      - NODE_FUNCTION_ALLOW_EXTERNAL=cheerio
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
